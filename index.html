    <!-- SPA routing fallback script for shared hosting -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

  <body style="margin:0;background:#0a0612;">
    <div id="root">
      <div id="boot-fallback" style="min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#0a0612;color:#fff;font-family:system-ui,sans-serif">
        <p style="margin:0;font-size:.95rem;color:rgba(255,255,255,.55)">Loading Regal Meeting…</p>
